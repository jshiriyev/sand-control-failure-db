services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sand_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sand_control}
      POSTGRES_DB: ${POSTGRES_DB:-sand_control}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sand_control}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no `ports:` mapping -- Postgres is reachable only from
    # other containers on the compose network, never from the host. To
    # inspect it locally: `docker compose exec db psql -U sand_control -d sand_control`.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sand_control}:${POSTGRES_PASSWORD:-sand_control}@db:5432/${POSTGRES_DB:-sand_control}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-true}
    ports:
      - "8000:8000"   # the API is the only thing meant to be reachable from outside
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
